<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dong ↔ Euro</title>
<meta name="apple-mobile-web-app-title" content="Dong Euro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f3f6f5; --card: #ffffff; --fg: #14221e; --muted: #5d6f69; --line: #d8e2de; --accent: #0f7a66; --warn: #9a5b00;
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1513; --card: #17211e; --fg: #e8f0ed; --muted: #93a7a0; --line: #2a3833; --accent: #3cc5a6; --warn: #e0a54a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .row:focus-within { border-color: var(--accent); }
  label { font-size: 0.78rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .field { display: flex; align-items: baseline; gap: 8px; }
  input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 700 2rem/1.2 var(--font); font-variant-numeric: tabular-nums; padding: 0; outline: none; }
  input::placeholder { color: var(--line); }
  .cur { font-size: 1.4rem; font-weight: 500; color: var(--muted); }
  .swap { text-align: center; color: var(--muted); font-size: 1.1rem; line-height: 1; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick button { font: 500 0.9rem var(--font); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .quick button:active { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rate { font-size: 0.9rem; color: var(--muted); line-height: 1.5; margin: 6px 0 0; }
  .rate strong { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  #status.offline { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Dong ↔ Euro</h1>

  <div class="row">
    <label for="vnd">Vietnamesische Dong</label>
    <div class="field">
      <input id="vnd" inputmode="numeric" autocomplete="off" placeholder="0" value="100.000">
      <span class="cur">₫</span>
    </div>
  </div>

  <div class="swap" aria-hidden="true">⇅</div>

  <div class="row">
    <label for="eur">Euro</label>
    <div class="field">
      <input id="eur" inputmode="decimal" autocomplete="off" placeholder="0">
      <span class="cur">€</span>
    </div>
  </div>

  <div class="quick" aria-label="Schnellauswahl Dong">
    <button type="button" data-v="10000">10.000 ₫</button>
    <button type="button" data-v="50000">50.000 ₫</button>
    <button type="button" data-v="100000">100.000 ₫</button>
    <button type="button" data-v="200000">200.000 ₫</button>
    <button type="button" data-v="500000">500.000 ₫</button>
  </div>

  <p class="rate">
    1 € = <strong id="r1"></strong> ₫<br>
    100.000 ₫ = <strong id="r2"></strong> €<br>
    <span id="status"></span>
  </p>
</main>

<script>
  // Fallback, falls noch nie online geladen wurde
  let rate = 28273.41, rateDate = '2026-11-18', fresh = false;
  try {
    const saved = JSON.parse(localStorage.getItem('vndRate') || 'null');
    if (saved && saved.rate > 0) { rate = saved.rate; rateDate = saved.date; }
  } catch (e) {}

  const vnd = document.getElementById('vnd');
  const eur = document.getElementById('eur');
  const fmtVnd = n => Math.round(n).toLocaleString('de-DE');
  const fmtEur = n => n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const parseEur = s => Number(s.replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, '')) || 0;
  const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };

  function fromVnd() {
    const digits = vnd.value.replace(/\D/g, '');
    vnd.value = digits ? fmtVnd(Number(digits)) : '';
    eur.value = digits ? fmtEur(Number(digits) / rate) : '';
  }
  function fromEur() {
    vnd.value = eur.value.trim() ? fmtVnd(parseEur(eur.value) * rate) : '';
  }
  function render() {
    document.getElementById('r1').textContent = fmtVnd(rate);
    document.getElementById('r2').textContent = fmtEur(100000 / rate);
    const st = document.getElementById('status');
    st.textContent = fresh ? `Kurs vom ${fmtDate(rateDate)}, aktuell` : `Kurs vom ${fmtDate(rateDate)}, gespeichert (offline)`;
    st.className = fresh ? '' : 'offline';
    if (document.activeElement === eur) fromEur(); else fromVnd();
  }

  vnd.addEventListener('input', fromVnd);
  eur.addEventListener('input', fromEur);
  eur.addEventListener('blur', () => { if (eur.value.trim()) eur.value = fmtEur(parseEur(eur.value)); });
  [vnd, eur].forEach(el => el.addEventListener('focus', () => el.select()));
  document.querySelectorAll('.quick button').forEach(b =>
    b.addEventListener('click', () => { vnd.value = b.dataset.v; fromVnd(); }));

  render();

  async function update() {
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/EUR', { cache: 'no-store' });
      const d = await r.json();
      if (d.result === 'success' && d.rates && d.rates.VND > 0) {
        rate = d.rates.VND;
        rateDate = new Date(d.time_last_update_unix * 1000).toISOString().slice(0, 10);
        fresh = true;
        try { localStorage.setItem('vndRate', JSON.stringify({ rate, date: rateDate })); } catch (e) {}
        render();
      }
    } catch (e) { /* offline: gespeicherter Kurs bleibt */ }
  }
  update();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
